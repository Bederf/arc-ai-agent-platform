[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "applied-ai-agent-platform"
version = "0.1.0"
description = "A governed MCP agent reference workflow with evaluation and audit tracing"
requires-python = ">=3.11"
dependencies = ["mcp>=1.0,<2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*", "evaluation*"]
